spring.application.name=factory-events-backend
server.port=${SERVER_PORT:8080}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/factory_events_db}
spring.datasource.username=${DB_USERNAME:factory}
spring.datasource.password=${DB_PASSWORD:factory_local}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
management.endpoints.web.exposure.include=health,info,metrics
server.error.include-message=never
server.error.include-stacktrace=never

# Correlation IDs identify a request across logs and HTTP responses.
logging.pattern.level=%5p [correlationId:%X{correlationId:-none}]
server.error.include-binding-errors=never
springdoc.paths-to-match=/api/**
springdoc.swagger-ui.path=/swagger-ui.html
