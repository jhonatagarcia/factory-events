name: factory-events-e2e
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: events_e2e
      POSTGRES_USER: e2e
      POSTGRES_PASSWORD: e2e_local
    ports:
      - "127.0.0.1:55433:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U e2e -d events_e2e"]
      interval: 2s
      timeout: 5s
      retries: 30
